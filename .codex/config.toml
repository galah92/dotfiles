# Docs: https://developers.openai.com/codex/config-basic
# Equivalent to `codex --yolo`. Intended for running inside a VM, which is the
# externally-sandboxed environment that flag is designed for.
sandbox_mode = "danger-full-access"
approval_policy = "never"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
personality = "pragmatic"
suppress_unstable_features_warning = true

[notice]
fast_default_opt_out = true

[features]
collaboration_modes = true
shell_snapshot = true
multi_agent = true
apps = true
terminal_resize_reflow = true
memories = true
goals = true

[tui]
theme = "ansi"
status_line = [
  "model-with-reasoning",
  "current-dir",
  "context-usage",
  "five-hour-limit"
]
vim_mode_default = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

[projects."/Users/galah92/Downloads"]
trust_level = "trusted"

[projects."/Users/galah92/dotfiles"]
trust_level = "trusted"
