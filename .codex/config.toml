# Docs: https://developers.openai.com/codex/config-basic
# Equivalent to `codex --yolo`. Intended for running inside a VM, which is the
# externally-sandboxed environment that flag is designed for.
sandbox_mode = "danger-full-access"
approval_policy = "never"
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
personality = "pragmatic"
suppress_unstable_features_warning = true

[notice]
fast_default_opt_out = true

[features]
collaboration_modes = true
shell_snapshot = true
multi_agent = true
apps = true
terminal_resize_reflow = true
memories = true
goals = true

[tui]
theme = "ansi"
status_line = ["model-with-reasoning", "current-dir", "context-used", "five-hour-limit", "weekly-limit", "thread-title"]
vim_mode_default = true
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.6-sol" = 4
