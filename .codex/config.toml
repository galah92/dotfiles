# Docs: https://developers.openai.com/codex/config-basic
# Equivalent to `codex --yolo`. Intended for running inside a VM, which is the
# externally-sandboxed environment that flag is designed for.
sandbox_mode = "danger-full-access"
approval_policy = "never"
model = "gpt-6-sol"
personality = "pragmatic"

[features]
memories = true

[tui]
theme = "ansi"
notification_condition = "always"
notification_method = "bel"
status_line = ["model-with-reasoning", "current-dir", "context-used", "five-hour-limit", "weekly-limit", "thread-title"]
vim_mode_default = true
